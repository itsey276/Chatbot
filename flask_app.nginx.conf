server {
    listen 8080;
    server_name _;  # Replace with your domain name or IP

    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;
        proxy_redirect off;
    }

    location /static {
        alias /home/thinh/flask_app/static;  # Adjust if you have static files
        expires 30d;
    }
}